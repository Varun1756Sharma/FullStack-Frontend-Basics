<html>
    <head>
        <title>Document</title>
        <style>
            #card{
                height: 200px;
                width: 200px;
                background-color: red;
            }
            #card:hover{
                background-color: blue;
            }
            #card:active{
                background-color: green;
            }
            input:focus{
                background-color: aqua;
            }
            h1::after{
                content: "Name";
            }
        </style>
    </head>
    <body>
        <div id="card"></div>
        <br />
        <br />
        <form>
            <label for="name">Name :</label>
            <input type="text" id="name" name="name" />
        </form>
                    <h1>HelloWorld</h1>
    </body>
</html>
