<html>
    <head>
        <title>Document</title>
        <style>
            .gridd{
                height: 100vh;
                width: 100%;
                display: grid;
                grid-template-rows: 1fr 5fr;
            }
            header{
                background-color: bisque;
            }
            main{
                height: 100vh;
                width: 100%;
                display: grid;
                grid-template-rows: 1fr 5fr;

            }
            .card1{
                background-color: aqua;
            }
            .card2{
                background-color: antiquewhite;
                box-sizing: border-box;
            }
            section{
                display: flex;
                gap: 20px;
                flex-wrap: wrap;

            }
            article{
                height: 100px;
                width: 100px;
                background-color: brown;

            }
        </style>
    </head>
    <body>
        <div class="gridd">
            <header></header>
            <main>
                <article></article>
                <article></article>
                <article></article>
                <article></article>
                <article></article>
                <article></article>
                <article></article>

            </main>
        </div>
    </body>
</html>
