<html>
    <head>
        <title>Student Registeration Form</title>
    </head>
    <body>
        <h1 align = "center">Register Here</h1>
        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name: </label>
                <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required />
                <br/>
                <br/>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="xyz123@gmail.com" required />
                <br/>
                <br/>

                <label for="contact">Phone Number:</label>
                <input type="tel" id="contact" name="contact" placeholder="Enter your 10 digit phone number" />
                <br/>
                <br/>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter the password" required/>
                <br/>
                <br/>

                <label for="dob">Date of Birth: </label>
                <input type="date" id="dob" required/>
                <br/>
                <br/>

                <label for="time">Preffered Time: </label>
                <input type="time" id="time" name="time"/>
                <br/>
                <br/>
                <p>Gender: </p>
                <input type="radio" id="male" name="gender" />
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" />
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" />
                <label for="other">Other</label>
            
            </fieldset>
            <br/>
            <fieldset>
                <legend>Academic Information</legend>
                <label for="course">Select Course :</label>
                <select id="course" name="course" required>
                    <option value="">--Select Course--</option>
                    <option value="bca">BCA</option>
                    <option value="btech">B.Tech</option>
                    <option value="mca">MCA</option>
                    <option value="b.sc">B.Sc</option>
                </select>
                <br/>
                <br/>
                <label for="Programming">Known Programming Language</label>
                <br/>
                <select id="programming" name="programming" multiple size="4">
                    <option value="html">HTML</option>
                    <option value="java">JAVA</option>
                    <option value="javascript">JAVASCRIPT</option>
                    <option value="python">PYTHON</option>
                </select>
                <br/>
                <br/>
                <label for="skillLevel">Programming skills level:</label>
                <input type="range" min="0" id="skillLevel" name="skillLevel" max="100" value="50"/>
                <br/>
                <br/>
                <label for="city">City: </label>
                <input type="text" list="cities" id="city" name="city" />

                <datalist id="cities">
                    <option value="Delhi"/>
                    <option value="Mumbai"/>
                    <option value="Chennai"/>
                    <option value="Pune"/>
                    <option value="Agra"/>
                    <option value="Kolkata"/>
                    <option value="Mathura"/>

                </datalist>


            </fieldset>
        </form>
    </body>
</html>
