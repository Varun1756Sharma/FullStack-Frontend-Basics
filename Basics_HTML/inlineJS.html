<!DOCTYPE html>

                width: 100px;
            }

    <body>

    <script>
        var Door = parseInt(prompt("Enter door number"));
        switch(Door){
            case 1:
                console.log(`Fire`);
                break;
            case 2:
                console.log(`Water`);
                break;
            case 3:
                console.log(`Thunderstorm`);
                break;
            case 4:
                console.log(`Treasure`);
                break;
            case 5:
                console.log(`Snakes`);
                break;
            default:
                console.log(`You have entered an invalid number`);
                break;
        }
        
    </script>
