<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Animation</title>
    <style>
        main{
            width: 600px;
            height: 700px;
            margin: auto;
            box-shadow: 0 0 15px 5px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        article{
            width: 100%;
            height: 100%;
            background-color: pink;
            display: flex;
            opacity: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 2s ease;

        }
        article h1{
            font-size: 50px;
            color: brown;
            margin-bottom: 20px;
        }
        article p{
            font-size: 25px;
            color: red;
        }
        section{
            width: 100%;
            height: 100%;
            display: flex;
            position: absolute;
            top: 0px;
            left: 0px;

        }
        section > div{
            background:linear-gradient(brown, red, brown);
            height: 100%;
            flex: 1;
            border: 2px solid black;
            display: flex;
            align-items: center;
            padding: 10px;
            transition: transform 5s ease;
        }

        section div a{
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background-color: goldenrod;
            display: inline-block;
            border: 2px solid black;
        }
        #main:target .door1{
            transform: translateX(-100%);
        }
        #main:target .door2{
            transform: translateX(100%);
        }
        #main:target article{
            opacity: 1;
        }
    </style>
</head>
<body>
    <main id="main">
        <article>
            <h1>Happy Birthday!</h1>
            <p>Wishing you a day full of happiness and joy!</p>
        </article>
        <section>
            <div class="door1"></div>
            <div class="door2">
                <a href="#main"></a>
            </div>
            
        </section>
    </main>

</body>
</html>
