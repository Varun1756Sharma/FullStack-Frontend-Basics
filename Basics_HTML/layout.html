<html>
    <head>
        <title>Document</title>
    
    
        <style>
            div{
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 1fr 5fr 1fr;
            grid-template-rows: 1fr 5fr;
            grid-template-areas: 
            "header header header"
            "sidebar main address"
            "footer footer footer"
            "sidebar main address"
            ; 
            }
            header{
                grid-area: header;
                background-color: green;
            }
            aside{
                grid-area: sidebar;
                background-color:aqua;
            }
            main{
                grid-area: main;
                background-color: red;
            }
            address{
                grid-area: address;
                background-color: blue;
            }
            footer{
                grid-area: footer;
                background-color: green;

            }
        </style>
    </head>
    <body>
        <div>
            <header></header>
            <aside></aside>
            <main></main>
            <address></address>
        </div>
    </body>
</html>
